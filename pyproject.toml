[project]
name = "arxiv_digestables"
version = "0.0.1"
description = """\
Pipeline for generating comparisons of scientific papers.
"""
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "sacrebleu==2.3.2",
    "hydra-core",
    "anthropic>=0.2.10",
    "diskcache==5.6.1",
    "filelock>3.13.1",
    "Jinja2>=3.1.2",
    "omegaconf>=2.3.0",
    "nltk==3.8.1",
    "unidecode",
    "beautifulsoup4==4.12.2",
    "sentence-transformers>=2.7.0",
    "tenacity>=8.3.0",
    "papermage>=0.20.0",
    "beautifulsoup4==4.12.2",
    "diskcache==5.6.1",
    "nltk==3.8.1",
    "numpy==1.26.3",
    "openai==1.3.3",
    "pandas==2.1.3",
    "requests==2.31.0",
    "requests-cache==1.1.1",
    "sacrebleu==2.3.2",
    "scikit-learn==1.3.2",
    "scipy==1.11.4",
    "tiktoken>=0.4.0",
    "together==1.2.0",
    "torch==2.1.1",
    "tqdm==4.66.2",
    "transformers==4.35.2",
    "typing_extensions>=4.5.0",
    "unidecode"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
keywords = [
]

[[project.authors]]
name = "Allen Institute for Artificial Intelligence"
email = "contact@allenai.org"

[[project.authors]]
name = "Benjamin Newman"
email = "blnewman@cs.washington.edu"

[[project.authors]]
name = "Yoonjoo Lee"
email = "lyoonjoo.lee@kaist.ac.kr"

[[project.authors]]
name = "Kyle Lo"
email = "kylel@allenai.org"

[[project.maintainers]]
name = "Benjamin Newman"
email = "blnewman@cs.washington.edu"

[project.urls]
"Homepage" = "https://github.com/bnewm0609/arxivDIGESTables"
"Repository" = "https://github.com/bnewm0609/arxivDIGESTables"
"Bug Tracker" = "https://github.com/bnewm0609/arxivDIGESTables"


[tool.setuptools.packages.find]
where = ["./experiment"]
include = ["paper_comparison"]
namespaces = false

[tool.setuptools.package-data]
decontext = ["py.typed", "templates/*"]


[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools >= 61.0.0",
    "pip >= 21.0.0",
    "wheel"
]

[project.optional-dependencies]
dev = [
    "black[jupyter]==23.7.0",
    "isort==5.12.0",
    "mypy==1.4.1",
    "ipython>=8.12.0",
    "autopep8==2.0.2",
    "flake8==6.1.0",
    "ipdb==0.13.13",
    "flake8-pyi==23.6.0",
    "Flake8-pyproject==1.2.3",
    "pytest==7.1.3",
    "pytest-xdist==3.3.1",
    "pytest-cov==4.1.0",
]

[tool.black]
line-length = 115
include = '\.pyi?$'
exclude = '''
(
      __pycache__
    | \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.vscode
    | \.venv
    | \bdist\b
    | \bdoc\b
)
'''

[tool.isort]
profile = "black"
line_length = 115
multi_line_output = 3

[tool.autopep8]
max_line_length = 115
in-place = true
recursive = true
aggressive = 3

[tool.mypy]
python_version = 3.8
ignore_missing_imports = true
no_site_packages = true
allow_redefinition = false

[tool.mypy-tests]
strict_optional = false

[tool.flake8]
exclude = [
    ".venv/",
    "tmp/"
]
per-file-ignores = [
    '*.py:E203',
    '__init__.py:F401',
    '*.pyi:E302,E305'
]

[tool.pytest.ini_options]
addopts = '-n auto --cov=.'
testpaths = ["tests/"]
python_classes = ["Test*", "*Test"]
log_format = "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
log_level = "DEBUG"
markers = []
filterwarnings = []

[tool.coverage.run]
omit = [
    '*__init__*',
    '*Test*',
    'tests/fixtures/*',
    'tests/*',
]
[tool.coverage.report]
fail_under = 25
